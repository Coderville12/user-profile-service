spring.application.name=user-profile-service

server.port=8081
# --- Database connection ---
spring.datasource.url=jdbc:mysql://localhost:3306/banklite_userdetails_db?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA behaviour ---

# Disable Hibernate schema auto-update
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

#--liquibase properties---
# Enable Liquibase
spring.liquibase.enabled=true

# Path to master changelog (YAML master file)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

logging.level.liquibase=INFO
logging.level.org.springframework.liquibase=INFO

# --- Kafka Configuration ---

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=user-service-consumer-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest



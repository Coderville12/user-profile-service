# new configuration from claude for kafka
# Kafka Bootstrap Server
spring.kafka.bootstrap-servers=localhost:9092

# ============================================
# CONSUMER CONFIGURATION
# ============================================

# Consumer Group ID
spring.kafka.consumer.group-id=my-consumer-group

# Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Auto offset reset (earliest, latest, none)
# earliest: start from beginning if no offset exists
# latest: start from end (only new messages)
spring.kafka.consumer.auto-offset-reset=earliest

# Enable auto commit
spring.kafka.consumer.enable-auto-commit=true

# Auto commit interval in milliseconds
spring.kafka.consumer.auto-commit-interval=1000

# Maximum records per poll
spring.kafka.consumer.max-poll-records=500

# Session timeout in milliseconds
spring.kafka.consumer.properties.session.timeout.ms=30000

# Heartbeat interval in milliseconds
spring.kafka.consumer.properties.heartbeat.interval.ms=3000

# Maximum time between polls
spring.kafka.consumer.properties.max.poll.interval.ms=300000

# Fetch minimum bytes
spring.kafka.consumer.fetch-min-size=1

# Fetch maximum wait time in milliseconds
spring.kafka.consumer.fetch-max-wait=500

# ============================================
# JSON DESERIALIZER CONFIGURATION
# ============================================

# Trust all packages for deserialization (use with caution in production)
#spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Or specify specific packages (recommended for production)
# spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.kafka.dto

# Type mapping for JSON deserialization
#spring.kafka.consumer.properties.spring.json.type.mapping=userEvent:com.gp.user_profile_service.event.OrderEvent

spring.kafka.consumer.properties.spring.json.trusted.packages=com.gp.user_profile_service.event
# Use type headers
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Default type for deserialization
spring.kafka.consumer.properties.spring.json.value.default.type=com.gp.user_profile_service.event.OrderEvent

# ============================================
# LISTENER CONFIGURATION
# ============================================

# Concurrency level (number of threads per consumer)
spring.kafka.listener.concurrency=3





# Acknowledge mode (RECORD, BATCH, TIME, COUNT, COUNT_TIME, MANUAL, MANUAL_IMMEDIATE)
spring.kafka.listener.ack-mode=MANUAL
# Type of listener (single, batch)
spring.kafka.listener.type=single

# ============================================
# ERROR HANDLING & RETRY
# ============================================

# Retry interval in milliseconds
spring.kafka.listener.backoff.interval=1000

# Maximum retry attempts
spring.kafka.listener.backoff.max-attempts=3

# Multiplier for exponential backoff
spring.kafka.listener.backoff.multiplier=2.0

# ============================================
# TOPIC CONFIGURATION
# ============================================
kafka.topic.name=order-created

# ============================================
# LOGGING
# ============================================
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
logging.level.com.example.kafka=DEBUG
